<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de reservas de tickets de la U.E.F. Pablo Hannibal Vela Egüéz.">
    <title>U.E.F. Pablo Hannibal Vela Egüéz - Sistema de Tickets</title>
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="pagina-inicio">

    <!-- 1. BARRA DE NAVEGACIÓN -->
    <header>
        <nav class="navbar" aria-label="Navegación principal">
            <div class="nav-brand">
                U.E.F. "Pablo Hannibal Vela Egüéz"
            </div>
            <div class="nav-buttons">
                <a href="index.html" class="btn-nav active">Inicio</a>
                <a href="eventos.html" class="btn-nav">Ver Eventos</a>
                <a href="asistentes.html" class="btn-nav">Registrados</a>
                <a href="validar.html" class="btn-nav">Validar Tickets</a>
                <a href="admin.html" class="btn-nav btn-admin">Administración</a>
            </div>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="main-container">

        <!-- 2. LOGO INSTITUCIONAL (EXCLUSIVO DE LA PÁGINA DE INICIO) -->
        <section class="logo-section">
            <img src="img/logo.jpg" alt="Logo U.E.F. Pablo Hannibal Vela Egüéz" class="logo-img">
        </section>

        <!-- 3. CARRUSEL COMPACTO DE EVENTOS -->
        <section class="carousel-section">
            <h2 class="titulo-seccion-centro">Eventos Destacados</h2>
            
            <div class="carousel-wrapper">
                
                <!-- Contenedor dinámico de las tarjetas de texto -->
                <div id="carouselSlides" class="carousel-slides-container">
                    <div class="cargando-texto">Cargando información de eventos...</div>
                </div>

                <!-- Botones de navegación laterales -->
                <button type="button" id="btnPrev" class="carousel-control prev" aria-label="Evento anterior">&#10094;</button>
                <button type="button" id="btnNext" class="carousel-control next" aria-label="Siguiente evento">&#10095;</button>

                <!-- Puntos indicadores inferiores -->
                <div id="carouselDots" class="carousel-dots"></div>
            </div>
        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>&copy; 2026 U.E.F. "Pablo Hannibal Vela Egüéz" - Todos los derechos reservados.</p>
    </footer>

    <!-- Script de lógica de carrusel desde localStorage -->
    <script src="js/index.js"></script>
</body>
</html>
